name: Release desktop builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or branch to build (default: this ref)'
        required: false
      publish:
        description: 'Attach the builds to the release for that tag'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Neither artifact is worth publishing on its own, but a platform failure
      # should still leave the other one inspectable rather than cancelled.
      fail-fast: false
      matrix:
        include:
          - label: Windows
            os: windows-latest
            # Zip only. The single-file portable build re-extracts its whole
            # payload to a temp folder on every launch, so it starts slowly and
            # was never the one to recommend; shipping both only invited people
            # to pick the worse one.
            package: --win zip --x64
            artifact: InterAct.zip
          - label: macOS
            os: macos-latest
            # Universal, so one download covers Apple Silicon and Intel.
            package: --mac dmg --universal
            artifact: InterAct.dmg
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      # v6.1.0 or newer is required, not merely preferred: earlier versions do
      # not know pnpm 12's layout, and on Windows they leave a shim pointing at
      # ...\.bin\bin\..\global\v11\<hash>\node_modules\pnpm\pnpm — a path with
      # no file at the end of it, so every pnpm call in the job fails and
      # nothing is ever installed. Moving package.json to pnpm 12 is what
      # exposed it. macOS and the Ubuntu Pages deploy were both unaffected,
      # which is how it reached a tag unnoticed.
      #
      # The version below is duplication; keep it in step with packageManager
      # in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.5.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and typecheck
        run: |
          pnpm lint
          pnpm exec tsc -b

      # Deliberately built with no Supabase project configured: whoever downloads
      # this enters their own on first launch. Baking one in would send every
      # class to that project and bill its owner for everyone's AI usage.
      - name: Build
        run: pnpm build

      # The build above is only credential-free because no .env reaches the runner.
      # Check the bundle rather than trust that, so a committed .env fails the
      # release instead of shipping one person's project to everyone who downloads it.
      - name: Verify no project is baked in
        shell: bash
        run: |
          # Matches a real key, not the setup screen's own placeholder and
          # validation pattern, which legitimately contain the same prefix.
          if grep -rhoE 'sb_publishable_[A-Za-z0-9_-]{20,}' dist/assets | grep -q .; then
            echo "::error::A Supabase publishable key is embedded in the build. Refusing to publish."
            grep -rhoE 'sb_publishable_[A-Za-z0-9_-]{20,}' dist/assets | sed 's/\(.\{22\}\).*/\1.../' | sort -u
            exit 1
          fi
          echo "No Supabase project embedded."

      # The whole of schema.sql is handed to Postgres as a single statement, so
      # one syntax error anywhere in it leaves a new project with no tables at
      # all, and the only sign of it is 建立資料表失敗 on the setup screen. That
      # has happened: an editing pass turned two dollar-quoted blocks from the
      # doubled delimiter into a single character, which Postgres rejects
      # outright, and four releases went out unable to create a database.
      #
      # A shell check cannot parse SQL, but it can catch the one class of damage
      # that editing this file actually causes. Written without a single
      # backslash, using character classes instead, because a mangled backslash
      # in a quoted string is exactly what broke the schema in the first place.
      - name: Verify the schema's dollar-quoted blocks
        shell: bash
        run: |
          stray=$(grep -nE '[$]' supabase/schema.sql | grep -vE '[$][$]|[$][a-zA-Z_][a-zA-Z0-9_]*[$]' || true)
          if [ -n "$stray" ]; then
            echo "::error::schema.sql has a malformed dollar-quote delimiter."
            echo "$stray"
            exit 1
          fi
          fail=0
          for tag in $(grep -oE '[$][$]|[$][a-zA-Z_][a-zA-Z0-9_]*[$]' supabase/schema.sql | sort -u); do
            n=$(grep -oF "$tag" supabase/schema.sql | wc -l)
            if [ $((n % 2)) -ne 0 ]; then
              echo "::error::schema.sql: $tag appears $n times, so a block is left open."
              fail=1
            fi
          done
          [ $fail -eq 0 ] && echo "schema.sql: dollar-quoted blocks are well formed and balanced."
          exit $fail

      # The whole file runs as one transaction, so a statement that touches a
      # table before it is created does not merely fail — it takes every table
      # created before it down with it, and a brand new project comes out of a
      # successful-looking deployment completely empty. A migration written
      # beside the feature it belongs to, rather than below the table, is all
      # it takes; that is how `alter table public.answers` came to sit forty
      # lines above `create table public.answers`.
      - name: Verify no table is used before it is created
        shell: bash
        run: |
          awk '
          /^create table if not exists public\./ {
            match($0, /public\.[a-z_]+/); t=substr($0,RSTART+7,RLENGTH-7); created[t]=NR
          }
          { lines[NR]=$0 }
          END {
            bad=0
            for (n=1; n<=NR; n++) {
              line=lines[n]
              if (line ~ /^create table if not exists public\./) continue
              s=line
              while (match(s, /public\.[a-z_]+/)) {
                t=substr(s,RSTART+7,RLENGTH-7)
                s=substr(s,RSTART+RLENGTH)
                if (t in created && n < created[t]) {
                  printf "::error::schema.sql line %d uses public.%s, created at line %d\n", n, t, created[t]
                  bad++
                }
              }
            }
            if (bad) exit 1
            print "schema.sql: every table is created before it is used."
          }' supabase/schema.sql

      - name: Package
        run: pnpm exec electron-builder ${{ matrix.package }} --publish never

      # identity: '-' is easy to set and easy to have silently ignored, and the
      # difference only shows up as an app that will not open on an Apple Silicon
      # Mac. Read the signature back off the built app instead of assuming it.
      - name: Verify the app is signed
        if: matrix.os == 'macos-latest'
        run: |
          app=release/mac-universal/InterAct.app
          codesign --display --verbose=2 "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          echo "Architectures:"
          lipo -archs "$app/Contents/MacOS/InterAct"
          # Without these two strings macOS denies the microphone and the screen
          # outright, and the app looks broken rather than unapproved. PlistBuddy
          # exits non-zero on a missing key, so a dropped extendInfo fails here
          # instead of on someone's Mac.
          echo "Usage descriptions:"
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSScreenCaptureUsageDescription' "$app/Contents/Info.plist"

      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.label }}
          path: release/${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    # Pushing a tag publishes, as before. A manual run defaults to building only,
    # so an unsigned macOS build can be downloaded and actually opened on a Mac
    # before it goes onto the public release page.
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - name: Download builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: builds
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.ref || github.ref_name }}
        run: |
          notes=$(cat <<'MD'
          ## 下載

          | 系統 | 檔案 |
          |---|---|
          | Windows 10/11 （64 位元） | `InterAct.zip` |
          | macOS （Apple Silicon 與 Intel 通用） | `InterAct.dmg` |

          **Windows：** 解壓縮後執行資料夾裡的 `InterAct.exe` 即可，免安裝。
          建議解壓到固定位置（例如桌面或文件夾），之後直接從那裡開啟。

          **macOS：** 開啟 `InterAct.dmg`，把 InterAct 拖進「應用程式」。

          ## 首次使用

          開啟後會出現設定畫面，填入你自己的 Supabase 專案（專案識別碼與 publishable key）即可開始。
          學員端網址留空就好 —— QR Code 會自動帶上你的專案，課堂資料只會進你自己的 Supabase。

          尚未建立 Supabase 專案，請參考
          [部署教學](https://github.com/lienyujen/InterAct/blob/main/docs/InterAct-%E5%BE%9E%E9%9B%B6%E9%83%A8%E7%BD%B2%E8%88%87%E6%89%93%E5%8C%85%E6%95%99%E5%AD%B8.md)。

          ## 從舊版升級

          解壓縮或安裝新版之後，請**再跑一次自動部署**：場次管理 → 系統設定 →
          展開「還沒建立後端？讓 InterAct 幫你部署」→ 貼上 Supabase 存取權杖 → 開始自動部署。

          新版本可能用到舊資料庫還沒有的資料表或欄位，沒跑這一步的話，用到它們的功能會安靜地失效。
          部署是可重複執行的，現有的課堂資料不會被動到。

          ## macOS 首次開啟

          兩件事只需要做一次：

          1. **允許開啟。** 安裝檔未經 Apple 簽章，首次開啟會出現「無法打開，因為無法驗證開發者」。
             請到「系統設定 → 隱私權與安全性」，在下方找到 InterAct 並按「強制打開」。
             若顯示「已損毀」，請開啟「終端機」執行 `xattr -cr /Applications/InterAct.app` 後再開一次。
          2. **允許螢幕錄製。** InterAct 的題目都是從螢幕擷取而來，macOS 必須先授權。
             到「系統設定 → 隱私權與安全性 → 螢幕錄製」開啟 InterAct，**然後重新啟動 InterAct**（這一步不能省略）。
             使用即時字幕與同步口譯時，也會另外詢問麥克風權限。

          ## 注意

          Windows 的執行檔同樣未經程式碼簽章，SmartScreen 可能顯示「不明發行者」，
          請點「其他資訊 → 仍要執行」。部分公司電腦的資安政策可能直接封鎖。

          個人與教育用途免費；補習班、企業內訓與收費課程屬商業用途，
          請見 [授權說明](https://github.com/lienyujen/InterAct#授權)。
          MD
          )
          # workflow_dispatch is normally pointed at a tag that was already
          # released, so adding a platform to an existing release has to work as
          # well as creating a new one.
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$REPO" --title "InterAct $TAG" --notes "$notes"
            gh release upload "$TAG" --repo "$REPO" --clobber \
              builds/InterAct.zip \
              builds/InterAct.dmg
          else
            gh release create "$TAG" --repo "$REPO" \
              --title "InterAct $TAG" \
              --notes "$notes" \
              builds/InterAct.zip \
              builds/InterAct.dmg
          fi
